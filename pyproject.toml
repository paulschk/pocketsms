[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsms"
version = "0.1.0"
description = "Self-hosted SMS gateway for ISP-provided 4G routers (Orange Airbox, SFR, Bouygues, Free)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sms", "gateway", "hilink", "orange-airbox", "4g", "otp", "2fa", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# No dependencies. That is the point: Python's standard library is enough.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/paulschk/pocketsms"
Issues = "https://github.com/paulschk/pocketsms/issues"

[project.scripts]
pocketsms = "pocketsms.__main__:main"

[tool.setuptools]
packages = ["pocketsms"]

# The web interface is a real .html file next to the module: it must ship with
# the package or every page request would 404.
[tool.setuptools.package-data]
pocketsms = ["webui.html"]

[tool.ruff]
line-length = 100
target-version = "py39"
